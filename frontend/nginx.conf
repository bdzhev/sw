server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Regenerated from $API_URL by docker-entrypoint.sh on every container start.
  # A cached copy would pin a client to a stale API address.
  location = /config.js {
    add_header Cache-Control "no-store" always;
  }

  # Names the hashed bundles, so caching it would hide a rebuild.
  location = /index.html {
    add_header Cache-Control "no-store" always;
  }

  # Vite content-hashes these filenames, so a change is a new URL.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  # SPA fallback: every unknown path is a client route.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
